<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-theme="light">
    <div class="background"></div>

    <div class="header">
        <h1 class="title">2048</h1>
        <button class="theme-toggle" id="theme-toggle" type="button">
            <span id="theme-icon">🌙</span>
            <span id="theme-text">Oscuro</span>
        </button>
    </div>

    <div class="game-container">
        <div class="score-container">
            <div class="score">
                <span class="score-label">Puntuación</span>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="high-score">
                <span class="score-label">Mejor</span>
                <div class="score-value" id="high-score">0</div>
            </div>
        </div>

        <div class="grid" id="grid">
        </div>

        <div class="controls">
            <button id="restart-btn" type="button">🔄 Nuevo Juego</button>
        </div>
    </div>

    <div class="instructions">
        <p><strong>Cómo jugar:</strong> Usa las flechas del teclado o desliza en móviles<br>
        para mover las fichas. Combina números iguales para llegar a 2048!</p>
    </div>

    <div id="game-over">
        <div class="game-over-content">
            <h2 class="game-over-title">¡Juego Terminado!</h2>
            <p class="game-over-score">Puntuación final: <span id="final-score">0</span></p>
            <button id="restart-btn-gameover" type="button">🔄 Jugar de Nuevo</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
